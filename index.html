<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turn by Turn Speedway</title>
<meta name="description" content="Turowa gra o żużlu w przeglądarce: wybieraj tory zawodnikom, walcz o punkty w meczu 15 biegów.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%81%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#e9ecef;--fg:#10161d;--card:#ffffff;--mut:#5b6672;--acc:#f2b705;--acc-fg:#10161d;--bad:#d62839;--good:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1118;--fg:#eef2f6;--card:#17202b;--mut:#93a0ae;--good:#3ddc84}}
:root[data-theme="dark"]{--bg:#0c1118;--fg:#eef2f6;--card:#17202b;--mut:#93a0ae;--good:#3ddc84}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{max-width:520px;margin:0 auto;padding:8px 12px 16px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font:italic 800 24px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;margin:0}
#sc{font-size:16px;font-variant-numeric:tabular-nums}
#hs{color:var(--mut);font-size:14px;margin:4px 0}
#ord{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;margin-bottom:6px;min-height:22px}
#ord span{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:2px 8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
main{width:100%;aspect-ratio:360/270;position:relative}
canvas{width:100%;height:100%;border-radius:14px;display:block}
#panel{margin-top:10px;background:var(--card);border-radius:14px;padding:10px 12px}
#seg{font:italic 800 22px/1 "Barlow Condensed",Impact,sans-serif}
.leg{color:var(--mut);font-size:13px;margin:4px 0 8px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row b{width:96px;font-size:15px}
.seg3{flex:1;display:flex;gap:6px}
.ln{flex:1;font:inherit;border:0;border-radius:10px;padding:8px 2px;background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 2px var(--mut);display:flex;flex-direction:column;align-items:center;min-height:50px;cursor:pointer}
.ln span{font-size:14px}.ln small{font-size:11px;color:var(--mut);min-height:14px}
.ln.on{background:var(--acc);color:var(--acc-fg);box-shadow:none}.ln.on small{color:var(--acc-fg)}
button{font:inherit;font-weight:600}
.main{width:100%;font-size:19px;border:0;border-radius:12px;padding:13px;margin-top:8px;background:var(--acc);color:var(--acc-fg);cursor:pointer}
.main:disabled{opacity:.45}
.main:focus-visible,.ln:focus-visible,.alt:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#log{font-size:14px;line-height:1.35;min-height:58px;margin-top:8px;color:var(--mut)}
#log div:first-child{color:var(--fg)}
#ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,8,12,.6)}
#ov.show{display:flex}
#ov .card{background:var(--card);border-radius:14px;padding:18px 20px;max-width:350px;width:100%;text-align:center;box-sizing:border-box}
#ov h2{font:italic 800 32px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
#ov p{margin:6px 0;color:var(--mut);font-size:15px;line-height:1.35}
#ov ol{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:16px}
#ov li{display:flex;align-items:center;gap:8px;padding:3px 0}#ov li em{margin-left:auto;font-style:normal;color:var(--mut)}
.big{font-size:20px;color:var(--fg)!important}
.alt{font-size:17px;border:0;border-radius:10px;padding:11px 18px;margin-top:8px;background:var(--acc);color:var(--acc-fg);cursor:pointer}
.pkrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;justify-content:center}
.pk{font:inherit;border:0;border-radius:10px;padding:7px 10px;background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 2px var(--mut);display:flex;flex-direction:column;align-items:center;min-width:88px;cursor:pointer}
.pk small{font-size:11px;color:var(--mut)}
.pk.on{background:var(--acc);color:var(--acc-fg);box-shadow:none}.pk.on small{color:var(--acc-fg)}
.pk:disabled{opacity:.35}
.alt.sec{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--mut)}
.alt:disabled{opacity:.4}
#ov .card{max-height:92vh;overflow:auto}
.nm{display:inline-block;padding:0 7px;border-radius:8px;font-weight:700;line-height:1.4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.scb{font:inherit;font-size:15px;border:0;border-radius:10px;padding:3px 10px;background:var(--card);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
#tb{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(5,8,12,.72)}
#tb.show{display:flex}
#tb .card{background:var(--card);border-radius:14px;padding:14px 12px;max-width:430px;width:100%;box-sizing:border-box;max-height:94vh;overflow:auto;text-align:center}
#tb h2{font:italic 800 28px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 8px}
#tb p{color:var(--mut);font-size:12px;margin:8px 0}
.tbl{font-size:12.5px;text-align:left}
.tr{display:grid;grid-template-columns:20px 1fr 1fr 38px 50px;gap:4px;align-items:center;padding:4px 0;border-top:1px solid rgba(128,128,128,.25)}
.tr.th{font-weight:700;color:var(--mut);border-top:0}
.tr.pend{color:var(--mut)}
.tr i{font-style:normal;margin-left:4px;font-weight:700}
.hl{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10.5px;font-weight:800;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.45);margin-right:5px;flex:none;vertical-align:middle}
.rd{display:flex;align-items:center;margin:1px 0}
.rd span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd i{margin-left:auto;padding-left:4px}
.rd.pl{opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Turn by Turn Speedway</h1><button id="sc" class="scb"></button></header>
  <div id="hs"></div>
  <div id="ord"></div>
  <main id="box"><canvas id="c"></canvas></main>
  <section id="panel">
    <div id="seg"></div>
    <div class="leg">Na torze są koleiny i miejsca z lepszą przyczepnością, ale nie wiesz gdzie.</div>
    <div id="rows"></div>
    <button id="go" class="main">Jedź</button>
    <div id="log"></div>
  </section>
</div>
<div id="ov"><div class="card" id="oc"></div></div>
<div id="tb"><div class="card" id="tbc"></div></div>
<script>
const $=id=>document.getElementById(id);
const LAPS=4,K=.07,NH=15,GROOM=[3,7,11];
const WW=360,WH=270,S=120,r0=56,Wd=30,A=Math.PI*r0,L=2*S+2*A,cx=180,cy=135;
const LN=['Krawężnik','Środek','Banda'],LD=[0,.5,1],SD=[.3,.6,1],EX=[.3,.65,1];
const COLS=['#e63946','#2f7de1','#f2b705','#f4f4f4'],CN=['czerwony','niebieski','żółty','biały'];
const pts=[3,2,1,0];
const RO=[[['Kowal',.9],['Zawada',.8],['Bielecki',.7],['Jasiński',.65],['Lis',.6],['Nowak',.45],['Wrona',.4],['Pawlak',.55]],[['Orłowski',.9],['Sowa',.8],['Dąbrowa',.7],['Kruk',.65],['Wilk',.6],['Sikora',.45],['Mazur',.4],['Czajka',.55]]];
const CARD=[[[0,5],[1,6],[2,3],[4,5],[0,1],[2,6],[3,4],[0,2],[1,5],[3,6],[4,0],[1,2],[3,4]],[[0,4],[2,5],[1,6],[3,0],[5,4],[1,2],[0,6],[3,5],[2,4],[1,3],[6,0],[4,1],[2,3]]];

function pos(s,d){
  s=((s%L)+L)%L;const r=r0+d*Wd,xl=cx-S/2,xr=cx+S/2;
  if(s<S)return[xl+s,cy+r];
  s-=S;if(s<A){const f=s/A*Math.PI;return[xr+r*Math.sin(f),cy+r*Math.cos(f)]}
  s-=A;if(s<S)return[xr-s,cy-r];
  s-=S;const f=s/A*Math.PI;return[xl-r*Math.sin(f),cy-r*Math.cos(f)];
}
const SEQ=[{n:'Start',c:false,g0:S/2,g1:S,lap:1}];
for(let k=0;k<LAPS;k++){const last=k===LAPS-1;SEQ.push({n:'Łuk 1',c:true,g0:S,g1:S+A,lap:k+1},{n:'Prosta',c:false,g0:S+A,g1:2*S+A,lap:k+1},{n:'Łuk 2',c:true,g0:2*S+A,g1:L,lap:k+1},{n:last?'Prosta do mety':'Prosta',c:false,g0:L,g1:last?L+S/2:L+S,lap:k+1})}
const NSEG=SEQ.length;
function sOf(T){const i=Math.max(0,Math.min(NSEG-1,Math.floor(T))),q=SEQ[i];return q.g0+(T-i)*(q.g1-q.g0)}
function poly(d,from,to){const p=new Path2D();let f=true;for(let s=from;s<=to;s+=4){const[x,y]=pos(s,d);f?p.moveTo(x,y):p.lineTo(x,y);f=false}if(to-from>=L-1){const[x,y]=pos(to,d);p.lineTo(x,y);p.closePath()}return p}
const track=poly(.5,0,L),infield=poly(-.3,0,L),stand=poly(2.15,0,L),wp=[poly(0,0,L),poly(.5,0,L),poly(1,0,L)];
function segp(d,a,b){const p=new Path2D(),n=Math.max(2,Math.ceil((b-a)/3));for(let k=0;k<=n;k++){const[x,y]=pos(a+(b-a)*k/n,d);k?p.lineTo(x,y):p.moveTo(x,y)}return p}
const boards=[];{const N=Math.round(L/22),BC=['#e63946','#f4f4f4','#2f7de1'];for(let i=0;i<N;i++)boards.push([segp(1.5,i*L/N,(i+1)*L/N),BC[i%3]])}
const CP=['#e63946','#e63946','#f4f4f4','#f4f4f4','#2f7de1','#2f7de1','#f2b705','#2fbf71','#9b59d0','#ff9f1c','#9aa5b1'],crowd=[];
for(const d of[1.85,2.15,2.45])for(let g=0;g<L;g+=3){const[x,y]=pos(g+Math.random()*2,d+(Math.random()-.5)*.1);crowd.push([x-1.8,y-1.8,CP[Math.floor(Math.random()*CP.length)]])}

const cv=$('c'),ctx=cv.getContext('2d');let sc=1;
function fit(){const w=cv.clientWidth;if(!w)return;const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(w*WH/WW*dpr);sc=cv.width/WW}
window.addEventListener('resize',fit);

let R=[],seg=0,phase='idle',haz={bonus:[],rut:[]},sel=[1,1],anim=null,logs=[],M=null,red=false,groom=null;
const rnd=Math.random;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const act=()=>R.filter(r=>!r.dnf);
const TXT=['#fff','#fff','#111','#111'];
function nm(r){return '<span class="nm" style="background:'+r.col+';color:'+TXT[r.gi]+'">'+r.name+'</span>'}

/* ---------- mecz ---------- */
const SK='tbts-save-v1';
function saveGame(){try{localStorage.setItem(SK,JSON.stringify({v:1,h:M.h,sc:M.sc,tac:M.tac,wear:M.wear,t:M.t,hist:M.hist}))}catch(e){}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s&&s.v===1&&s.h>0&&s.h<NH&&Array.isArray(s.t)&&s.t[0].length===8&&s.t[1].length===8)return s}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(SK)}catch(e){}}
function mk(t){return RO[t].map(([name,sk],i)=>({name,sk,i,pts:0,st:0,inj:false}))}
function startMatch(){
  const sv=loadGame();
  M={h:0,sc:[0,0],tac:[false,false],wear:[0,0,0],t:[mk(0),mk(1)],gates:[],exl:[],pair:null,rs:[],nom:[],msg:'',hist:[]};
  R=[];phase='idle';$('go').disabled=true;$('rows').innerHTML='';$('seg').textContent='Mecz żużlowy';logs=[];logUi();hud();
  showOv('<h2>Turn by Turn Speedway</h2><p>Twoja drużyna (czerwony i niebieski) kontra goście (żółty i biały). Mecz ma 15 biegów po 4 okrążenia, za bieg punkty 3-2-1-0. Biegi 14 i 15 są nominowane, sam wybierasz w nich zawodników. Jeśli przegrywasz o co najmniej 6 punktów, możesz raz użyć rezerwy taktycznej. Po biegach 4, 8 i 12 tor jest równany.</p><p>Na łuku wybierasz każdemu zawodnikowi tor: krawężnik, środek albo bandę. Na prostej siła odśrodkowa wynosi zawodników na zewnątrz, więc wybierasz środek albo bandę. Ten sam tor to walka o pozycję. Na torze są koleiny i miejsca z lepszą przyczepnością, ale nie wiesz gdzie. Zdarzają się też upadki i defekty.</p><p>Postęp meczu zapisuje się automatycznie w tej przeglądarce po każdym biegu.</p><button class="alt" id="st">Do boju</button>');
  $('st').onclick=preHeat;
  if(sv){
    showOv('<h2>Turn by Turn Speedway</h2><p class="big">Masz zapisany mecz: bieg '+(sv.h+1)+' z '+NH+', wynik '+sv.sc[0]+':'+sv.sc[1]+'.</p><button class="alt" id="ct">Kontynuuj mecz</button><button class="alt sec" id="nw">Nowy mecz</button>');
    $('ct').onclick=()=>{Object.assign(M,{h:sv.h,sc:sv.sc,tac:sv.tac,wear:sv.wear,t:sv.t,hist:sv.hist});preHeat()};
    $('nw').onclick=()=>{clearSave();startMatch()};
  }
}
function preHeat(){
  R=[];phase='idle';seg=0;logs=[];logUi();$('rows').innerHTML='';$('go').disabled=true;$('seg').textContent='Bieg '+(M.h+1)+' z '+NH;
  M.exl=[];M.msg='';M.nom=[];hud();
  if(M.h>0)saveGame();
  if(M.h>=13){showNominate();return}
  M.pair=[CARD[0][M.h].slice(),CARD[1][M.h].slice()];
  const sb=[...subst(0,M.pair[0]).map(s=>'Zastępstwo za kontuzjowanego: '+s+'.'),...subst(1,M.pair[1]).map(s=>'Goście: zastępstwo '+s+'.')];
  M.msg=sb.join(' ');
  const o=tacOffer(1);if(o){applyTac(1,o);M.msg+=' Goście używają rezerwy taktycznej: '+o.leader.name+' za '+o.weak.name+'.'}
  showCard();
}
function tacOffer(t){
  if(M.tac[t]||M.sc[1-t]-M.sc[t]<6)return null;
  const p=M.pair[t],rs=M.t[t],slot=rs[p[0]].sk<rs[p[1]].sk?0:1,wi=p[slot];
  if(wi<3)return null;
  const li=[0,1,2].filter(i=>!p.includes(i)&&!rs[i].inj).sort((a,b)=>rs[b].sk-rs[a].sk)[0];
  if(li===undefined)return null;
  return{slot,wi,li,weak:rs[wi],leader:rs[li]};
}
function subst(t,pair){
  const rs=M.t[t],out=[];
  for(let k=0;k<2;k++){
    if(rs[pair[k]].inj){
      const c=rs.map((r,i)=>i).filter(i=>!rs[i].inj&&!pair.includes(i)&&rs[i].st<6).sort((a,b)=>((b===7)-(a===7))||rs[b].sk-rs[a].sk)[0];
      if(c!==undefined){out.push(rs[c].name+' za '+rs[pair[k]].name);pair[k]=c}
    }
  }
  return out;
}
function applyTac(t,o){M.pair[t][o.slot]=o.li;M.tac[t]=true}
function showCard(){
  const nm=(t,i)=>M.t[t][M.pair[t][i]];
  const li=(rd,k,who)=>'<li><span class="dot" style="background:'+COLS[k]+'"></span>'+rd.name+'<em>'+who+', '+CN[k]+'</em></li>';
  let h='<h2>Bieg '+(M.h+1)+' z '+NH+(M.h>=13?' (nominowany)':'')+'</h2><ol>'+li(nm(0,0),0,'ty')+li(nm(0,1),1,'ty')+li(nm(1,0),2,'goście')+li(nm(1,1),3,'goście')+'</ol>';
  if(M.msg)h+='<p>'+M.msg+'</p>';
  const o=M.h<13?tacOffer(0):null;
  if(o)h+='<p>Przegrywasz o '+(M.sc[1]-M.sc[0])+' pkt, możesz użyć rezerwy taktycznej.</p><button class="alt sec" id="tc">Rezerwa taktyczna: '+o.leader.name+' za '+o.weak.name+'</button>';
  h+='<button class="alt" id="st">Start</button>';
  showOv(h);
  if(o)$('tc').onclick=()=>{applyTac(0,o);M.msg='Użyto rezerwy taktycznej: '+o.leader.name+' za '+o.weak.name+'.';showCard()};
  $('st').onclick=startHeat;
}
function showNominate(){
  const rs=M.t[0],ok=r=>r.st<6&&!r.inj;
  let h='<h2>Bieg '+(M.h+1)+': nominowany</h2><p>Wybierz dwóch zawodników. Zawodnik może wystartować w meczu maksymalnie 6 razy.</p><div class="pkrow">';
  rs.forEach((r,i)=>{h+='<button class="pk'+(M.nom.includes(i)?' on':'')+'" '+(ok(r)?'':'disabled ')+'onclick="togN('+i+')"><b>'+(i+1)+'. '+r.name+'</b><small>'+(r.inj?'kontuzja':r.pts+' pkt, '+r.st+' biegów')+'</small></button>'});
  h+='</div><button class="alt" id="st"'+(M.nom.length===2?'':' disabled')+'>Zatwierdź</button>';
  showOv(h);
  $('st').onclick=()=>{
    M.pair=[M.nom.slice(),pickAi()];showCard();
  };
}
function togN(i){const k=M.nom.indexOf(i);if(k>=0)M.nom.splice(k,1);else if(M.nom.length<2)M.nom.push(i);showNominate()}
function pickAi(){return M.t[1].map((r,i)=>({i,s:r.pts+rnd()*1.5,ok:r.st<6&&!r.inj})).filter(x=>x.ok).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.i)}

function makeGates(){const m=shuffle([0,1]),o=shuffle([2,3]),pat=rnd()<.5?[1,0,1,0]:[0,1,0,1],g=[];pat.forEach((isMe,k)=>{g[isMe?m.pop():o.pop()]=[0,1/3,2/3,1][k]});return g}
function startHeat(){M.gates=makeGates();M.exl=[];buildR();begin()}
function buildR(){
  const rs=[M.t[0][M.pair[0][0]],M.t[0][M.pair[0][1]],M.t[1][M.pair[1][0]],M.t[1][M.pair[1][1]]];
  M.rs=rs;R=[];
  rs.forEach((rd,i)=>{if(M.exl.includes(i))return;R.push({gi:i,me:i<2,slot:i%2,rd,name:rd.name,col:COLS[i],sk:(rd.sk-.6)*.8,T:0,d:M.gates[i],lane:1,dT:0,dD:M.gates[i],a:null,dnf:false,fell:false,pp:0})});
  seg=0;sel=[1,1];haz={bonus:[],rut:[]};logs=[];phase='idle';red=false;
}

/* ---------- przebieg ---------- */
function genHaz(corner){
  const ln=shuffle(corner?[0,1,2]:[1,2]),n=rnd()<.3?1:2,h={bonus:[],rut:[]};
  for(let i=0;i<n;i++){const l=ln[i];(rnd()<Math.min(.8,.35+M.wear[l]*.0035)?h.rut:h.bonus).push(l)}
  return h;
}
function aiPick(corner,taken){
  let w=corner?[.45,.35,.2]:[0,.5,.5];
  if(rnd()<.2)w=corner?[1,1,1]:[0,1,1];
  for(let l=0;l<3;l++){if(taken.includes(l))w[l]*=.6}
  let x=rnd()*(w[0]+w[1]+w[2]);for(let l=0;l<3;l++){x-=w[l];if(x<=0&&w[l]>0)return l}return 2;
}
function resolve(Ar,ch,corner){
  const base=corner?[2,1.2,.4]:[1,1,1],vr=corner?[1.8,1,.5]:[.8,.8,.8];
  const rank=Ar.map(()=>0),duel=Ar.map(()=>-1),ev=[],res=[];
  for(let l=0;l<3;l++){
    const idx=Ar.map((r,k)=>k).filter(k=>ch[k]===l).sort((x,y)=>Ar[y].T-Ar[x].T);
    if(idx.length>1){
      const s2=idx.map((k,j)=>({k,s:rnd()+(j===0?.35:0)})).sort((x,y)=>y.s-x.s);
      s2.forEach((o,j)=>{rank[o.k]=j;duel[o.k]=s2[0].k;if(j>0)ev.push(nm(Ar[s2[0].k])+' wygrywa walkę o tor, '+nm(Ar[o.k])+' traci')});
    }
  }
  let fall=null,defect=null;
